---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  # A runtime dependency update is a fix(deps) commit, so it ships in a
  # patch release; a dev dependency update is a chore and ships nothing.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: scope
