---
name: Bug report
description: Something weftwork does is wrong, or it crashes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for the report. For a security problem, do not use this form:
        see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you saw.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands, in order, from a clean state.
      placeholder: |
        1. cd /path/to/project
        2. weftwork ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The full output of the failing command.
      render: text
  - type: input
    id: version
    attributes:
      label: weftwork version
      description: The output of `weftwork --version`, or the commit.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, `node --version`, and the agent host and its version.
      placeholder: Linux, Node 26.7.0, Claude Code 2.x
    validations:
      required: true
