---
# The pull request title becomes the squash commit on main, and the release
# tooling reads that commit to choose the next version, so the title must be
# a Conventional Commit of a type CONVENTIONS.md allows.
name: pr-title

"on":
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            chore
            style
            refactor
            test
          requireScope: false
