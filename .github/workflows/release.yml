---
# Releases (docs/RELEASING.md). On each push to main, release-please keeps
# one Release PR up to date: the next semantic version, read from the
# Conventional Commit titles since the last release, and the CHANGELOG.md
# entry. Merging that PR tags vX.Y.Z, makes the GitHub release, and the
# publish job puts that version on npm with trusted publishing (OIDC, no
# token) and provenance.
name: release

"on":
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    # Skipped until the owner sets up the release app (docs/RELEASING.md).
    if: vars.RELEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A PR opened with GITHUB_TOKEN starts no workflow, so the required
      # checks job would never run on the Release PR and it could not be
      # merged. A GitHub App token starts them.
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: bash tools/test-package.sh
      - run: npm publish
