---
name: ci

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: bash tools/setup.sh
      - run: yamllint .
      - run: bash tools/check-brief.sh --selftest
      - run: bash tools/check-briefs.sh
      - run: bash tools/test-setup.sh
      - run: npm run typecheck
      - run: npm test
      - run: bash tools/test-package.sh
