waivers:
- what: security-review threat model for e01 (build-epic step 0)
  why: No product code. The only executable surface is check-brief.sh, which runs
    verify strings from this repo. Briefs read one outside path, ../pi-flow-legacy,
    which the owner named for R14.
  date: 2026-11-07
  scope: e01 only
- what: plan-consistency-check MED findings (status ledger) for e01s01, e01s02, e01s04
  why: The checker wants failing/passing task statuses. CONVENTIONS.md line 52 sets
    todo, in_progress, done. The owner chose to keep the project convention. Whether
    to adopt the ledger is a question for R2.
  date: 2026-11-08
  scope: e01 only
- what: gate-trace FAIL (rule R1) for e01s03
  why: R1 fails any undone story with 0 code tags. All 14 undone stories have none,
    because the project has no code, so the gate cannot pass until code exists. The
    owner chose to waive it for e01. Oracle links are 96 percent heuristic; completeness-critic
    had 0 blockers; one MEDIUM blind spot (double-tag in e01s03-tasks.yaml, from depends_on)
    was left as is.
  date: 2026-11-08
  scope: e01 only
- what: security-review threat model for e02 (build-epic step 0)
  why: No product code. e02 writes research briefs only; the executable surface is
    check-brief.sh, as in e01. Briefs read web pages, GitHub metadata and the local
    .pi/gsd copy, read only. The owner chose to waive it.
  date: 2026-11-08
  scope: e02 only
- what: gate-trace FAIL (rule R1) for e02s02
  why: R1 fails any undone story with 0 code tags. All 13 undone stories have none,
    because the project has no code. e02s02's matrix links are specs/state.yaml (high,
    explicit tag) and its tasks file (low). The owner chose to waive it for e02, as
    for e01.
  date: 2026-11-08
  scope: e02 only
- what: plan-consistency-check CRITICAL/HIGH findings (missing story specs) and MED
    status-ledger findings for e02s01, e02s02, e02s04
  why: e02s01 and e02s02 are released, so specs written now would be paperwork. e02s04
    gets its spec when it is planned. The owner chose to keep the project status values
    todo, in_progress, done (CONVENTIONS.md), as for e01. Findings for e02s03 itself
    are clear.
  date: 2026-11-08
  scope: e02 only
- what: CONVENTIONS.md rule that gh is used only for PRs and clones (audit-code item)
    for e02s04
  why: The R5 research read host docs and release metadata with gh api. The brief's
    Method says so. The owner accepted the deviation and chose not to re-read the
    sources by raw URL. From now on use raw URLs, web fetch or gh repo clone.
  date: 2026-11-08
  scope: e02s04 only
- what: plan-consistency-check CRITICAL/HIGH findings (missing story specs) for e03s02
    to e03s08
  why: Those seven stories get their specs when each is planned. Planning them now
    would be paperwork. e03s01 itself is clear. The owner chose to waive it for e03,
    as for e02.
  date: 2026-11-08
  scope: e03 only
- what: gate-trace FAIL (rule R1) for e03s01
  why: R1 fails any undone story with 0 code tags. All 9 undone stories have none,
    because the project has no code. The oracle heuristic ratio is 94 percent; completeness-critic
    had 0 blockers; the blind-spot check had 0 HIGH findings. The owner chose to waive
    it for e03, as for e01 and e02.
  date: 2026-11-08
  scope: e03 only
- what: security-review threat model for e03 (build-epic step 0)
  why: No product code. e03 writes research briefs only; the executable surface is
    check-brief.sh and the task verify strings, as in e01 and e02. Briefs read web
    pages, arXiv abstracts and public repository files, read only. The owner chose
    to waive it.
  date: 2026-11-08
  scope: e03 only
- what: CONVENTIONS.md rule of no direct GitHub REST API calls (audit-code item) for
    e03s01
  why: The R6 research session called api.github.com with curl for commit ids and
    dates. The brief's Method says so. Every id and date was re-confirmed with git
    ls-remote, raw URLs at the cited commits and public Atom feeds. The owner accepted
    the deviation. From now on use raw URLs, web fetch, git ls-remote, Atom feeds
    or gh repo clone.
  date: 2026-11-08
  scope: e03s01 only
- what: request-review dual-blind AND-gate for e03s02 (rounds 3 to 5)
  why: Round 1 failed (reviewer A 73.5, reviewer B 80.4) and round 2 failed (A 86.7,
    B 94.8). Each round found real errors in the brief (a wrong claim about which
    reviewers run the declared command, and papers the first searches missed) and
    every finding was checked against its source and fixed. The owner chose to stop
    after round 2 and release. The round-2 fixes (commit 6aafdab) were not re-reviewed.
  date: 2026-11-08
  scope: e03s02 only
- what: request-review dual-blind AND-gate for e03s03 (rounds 4 to 5)
  why: Round 1 failed (reviewer A 71.7, reviewer B 78.1; six must-fix between them).
    Round 2 failed (A 88.2, B 93.1) and round 3 failed (A 93.8, B 82.9), with zero
    must-fix in both rounds; the shortfall was should-fix wording and papers the searches
    missed. Each round found real defects in the brief (a wrong H3 verdict, claims
    stretched past their sources, missed papers) and every finding was checked against
    its source and fixed. New papers kept turning up each round. The owner chose to
    stop after round 3 and release. The round 3 fixes (sources S46 to S51 and wording
    changes) were not re-reviewed.
  date: 2026-11-09
  scope: e03s03 only
handoff:
  next_skill: kickoff-branch
  next_story: e03s04
  note: 'e03s03 (R8 code quality and conventions) is done and released by pull request.
    Brief: docs/research/R8-code-quality-conventions.md (51 sources, 37 papers), verdicts
    H2, H3 and H5 all refined. request-review stopped after round 3 by the owner;
    the waiver is recorded. Next: kickoff-branch for e03s04 (R9 model routing and
    cost efficiency, e03 wave 3, 8 BCPs, dependencies met). Start it in a fresh session.
    e03s04 has a tasks file but no story spec yet; run plan-work after kickoff-branch,
    as for e03s03 (the e03 plan-consistency waiver covers this until it is planned).
    The e03 threat-model, gate-trace R1 and plan-consistency waivers cover all of
    e03. For whoever plans e04s02: decide whether it takes the stack choice (R8 Open
    questions, CONVENTIONS.md line 4, e05 note in release-plan.yaml). Open for the
    owner: the audit skill verify checks skills/ directories that do not exist in
    this repo; specs/traceability-matrix.json is gitignored, so regenerate it with
    bash scripts/trace-stories.sh --json when the completeness critic blocks; undecided
    R7 items (Superpowers fix-loop cap, bigpowers cap 5 against round N/3, Claude
    Code auto mode in -p runs). Lessons: (1) kickoff-branch: create the branch first,
    then commit the checkpoint; never commit on main. (2) Independent reviewers found
    13 papers the first 16 arXiv queries missed in R8, and similar misses in R7, so
    run broad queries over https (the API returns an empty reply over http and HTTP
    429 if queried fast; sleep 5 between queries) before writing any absence claim,
    and treat every unsourced claim as a limit of the queries. (3) Read the reviewer
    prompt of each tool for what it tells the reviewer to run. (4) BUG-004 reproduced
    again: scripts/record-cycle-time.sh removes the --- line from execution-status.yaml;
    restore it by hand before committing. (5) Check every number and quote against
    the abstract before stating it; the reviewers main findings were claims stretched
    past their sources. Candidate stories for R10: from R7 a same-model against different-model
    reviewer test on seeded defects, a fresh against continued reviewer context test,
    mutants as review evidence, and a full-text read of R7 S2, S8, S12, S13, S14 and
    S37; from R8 executable checks compiled from AGENTS.md conventions against prose-only
    (ContextCov), the user-level existing-code-takes-precedence sentence on pi and
    Claude Code, a command-resolution check on this repository AGENTS.md, and context
    files with and without conventions measured on pass rate, cost, erosion and verbosity.
    Use raw URLs, web fetch, git ls-remote, Atom feeds or the https arXiv API for
    docs, not gh api or api.github.com. Every commit needs a Story: e03s04 trailer.'
