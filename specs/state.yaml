    it for e03, as for e01 and e02.
  date: 2026-11-08
  scope: e03 only
- what: security-review threat model for e03 (build-epic step 0)
  why: No product code. e03 writes research briefs only; the executable surface is
    check-brief.sh and the task verify strings, as in e01 and e02. Briefs read web
    pages, arXiv abstracts and public repository files, read only. The owner chose
    to waive it.
  date: 2026-11-08
  scope: e03 only
- what: CONVENTIONS.md rule of no direct GitHub REST API calls (audit-code item) for
    e03s01
  why: The R6 research session called api.github.com with curl for commit ids and
    dates. The brief's Method says so. Every id and date was re-confirmed with git
    ls-remote, raw URLs at the cited commits and public Atom feeds. The owner accepted
    the deviation. From now on use raw URLs, web fetch, git ls-remote, Atom feeds
    or gh repo clone.
  date: 2026-11-08
  scope: e03s01 only
handoff:
  next_skill: kickoff-branch
  next_story: e03s02
  note: 'e03s01 (R6 multi-agent work in one codebase) is done and released by pull
    request. Brief: docs/research/R6-multi-agent-codebase.md, verdicts H11 and H12
    both refined. Next: kickoff-branch for e03s02 (R7 agent review and agent-answered
    decisions, e03 wave 3, 5 BCPs, dependencies met). Start it in a fresh session.
    e03s02 has a tasks file but no story spec yet; run plan-work after kickoff-branch,
    as for e03s01 (the e03 plan-consistency waiver covers this until it is planned).
    The e03 threat-model and gate-trace R1 waivers are recorded and cover all of e03.
    Resolved by the 2026-11-08 chore PR: the e04 stash is landed (candidate
    build epics), BUG-003 is closed by decision, BUG-004 is mitigated by a
    stricter yamllint rule, and the owner will file no upstream bug reports.
    The R5 and R3 candidates are scheduled: e04s03 (R16 evidence refresh,
    runs before the synthesis) and two tasks in e03s07 (R13). R6 open questions that may become stories: measure re-learning cost per dispatch
    unit, a disjoint versus overlapping scope conflict experiment (for R10), and a
    full-text read of CAID, STORM, Co-Coder and CodeCRDT. Lessons from R6 review:
    check absence claims against the whole cited source, and check the order of steps
    in a source. Use raw URLs, web fetch, git ls-remote or Atom feeds for docs, not
    gh api or api.github.com. Every commit needs a Story: e03s02 trailer.'
