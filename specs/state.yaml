  why: Those seven stories get their specs when each is planned. Planning them now
    would be paperwork. e03s01 itself is clear. The owner chose to waive it for e03,
    as for e02.
  date: 2026-11-08
  scope: e03 only
- what: gate-trace FAIL (rule R1) for e03s01
  why: R1 fails any undone story with 0 code tags. All 9 undone stories have none,
    because the project has no code. The oracle heuristic ratio is 94 percent; completeness-critic
    had 0 blockers; the blind-spot check had 0 HIGH findings. The owner chose to waive
    it for e03, as for e01 and e02.
  date: 2026-11-08
  scope: e03 only
- what: security-review threat model for e03 (build-epic step 0)
  why: No product code. e03 writes research briefs only; the executable surface is
    check-brief.sh and the task verify strings, as in e01 and e02. Briefs read web
    pages, arXiv abstracts and public repository files, read only. The owner chose
    to waive it.
  date: 2026-11-08
  scope: e03 only
- what: CONVENTIONS.md rule of no direct GitHub REST API calls (audit-code item) for
    e03s01
  why: The R6 research session called api.github.com with curl for commit ids and
    dates. The brief's Method says so. Every id and date was re-confirmed with git
    ls-remote, raw URLs at the cited commits and public Atom feeds. The owner accepted
    the deviation. From now on use raw URLs, web fetch, git ls-remote, Atom feeds
    or gh repo clone.
  date: 2026-11-08
  scope: e03s01 only
handoff:
  next_skill: request-review
  next_story: e03s02
  note: 'e03s02 (R7 agent review and agent-answered decisions) is planned,
    built and verified on branch e03s02-r7-agent-review. Brief:
    docs/research/R7-review-and-decisions.md, verdicts H1, H13 and H14 all
    refined. request-review round 1 of 5 failed the AND-gate (reviewer A
    73.5, reviewer B 80.4); the fixes are applied to the brief and are not
    yet committed. Next: commit the fixes with the owner go-ahead, run
    request-review round 2 in a fresh session, then release-branch. Open
    items for the owner: confirm the e03 gate-trace R1 waiver covers e03s02
    (the completeness critic reports a BLOCKER for zero story-tag links),
    and read the H1, H13 and H14 verdicts (Verification Script steps 3 and 4
    in the story spec). Lessons from R7 review: check absence claims with
    arXiv API queries, not web search alone, and read each tool reviewer
    prompt for what it tells the reviewer to run. Use raw URLs, web fetch,
    git ls-remote or Atom feeds for docs, not gh api or api.github.com.
    Every commit needs a Story: e03s02 trailer.'
