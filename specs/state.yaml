  why: Those seven stories get their specs when each is planned. Planning them now
    would be paperwork. e03s01 itself is clear. The owner chose to waive it for e03,
    as for e02.
  date: 2026-11-08
  scope: e03 only
- what: gate-trace FAIL (rule R1) for e03s01
  why: R1 fails any undone story with 0 code tags. All 9 undone stories have none,
    because the project has no code. The oracle heuristic ratio is 94 percent; completeness-critic
    had 0 blockers; the blind-spot check had 0 HIGH findings. The owner chose to waive
    it for e03, as for e01 and e02.
  date: 2026-11-08
  scope: e03 only
- what: security-review threat model for e03 (build-epic step 0)
  why: No product code. e03 writes research briefs only; the executable surface is
    check-brief.sh and the task verify strings, as in e01 and e02. Briefs read web
    pages, arXiv abstracts and public repository files, read only. The owner chose
    to waive it.
  date: 2026-11-08
  scope: e03 only
- what: CONVENTIONS.md rule of no direct GitHub REST API calls (audit-code item) for
    e03s01
  why: The R6 research session called api.github.com with curl for commit ids and
    dates. The brief's Method says so. Every id and date was re-confirmed with git
    ls-remote, raw URLs at the cited commits and public Atom feeds. The owner accepted
    the deviation. From now on use raw URLs, web fetch, git ls-remote, Atom feeds
    or gh repo clone.
  date: 2026-11-08
  scope: e03s01 only
- what: request-review dual-blind AND-gate for e03s02 (rounds 3 to 5)
  why: Round 1 failed (reviewer A 73.5, reviewer B 80.4) and round 2 failed (A 86.7,
    B 94.8). Each round found real errors in the brief (a wrong claim about which
    reviewers run the declared command, and papers the first searches missed) and
    every finding was checked against its source and fixed. The owner chose to stop
    after round 2 and release. The round-2 fixes (commit 6aafdab) were not re-reviewed.
  date: 2026-11-08
  scope: e03s02 only
handoff:
  next_skill: develop-tdd
  next_story: e03s03
  note: 'e03s03 is planned and approved (2026-11-09). Branch
    e03s03-r8-code-quality-conventions exists. R8 is stack-agnostic by owner
    choice. Start develop-tdd at task 1 (stack-choice fix, own commit). Older
    note follows. e03s02 (R7 agent review and agent-answered decisions) is done and released
    by pull request. Brief: docs/research/R7-review-and-decisions.md, verdicts H1,
    H13 and H14 all refined. request-review failed the AND-gate in rounds 1 and 2
    and the owner stopped it there; the waiver is recorded. Next: kickoff-branch for
    e03s03 (R8 code quality and conventions, e03 wave 3, 5 BCPs, dependencies met).
    Start it in a fresh session. e03s03 has a tasks file but no story spec yet; run
    plan-work after kickoff-branch, as for e03s02 (the e03 plan-consistency waiver
    covers this until it is planned). The e03 threat-model, gate-trace R1 and plan-consistency
    waivers are recorded and cover all of e03. Lessons from R7: (1) kickoff-branch
    commits the spec-only checkpoint on main before it branches, which put a commit
    on local main ahead of origin/main and needed a reset; create the branch first,
    then commit the checkpoint, and never commit on main. (2) Two review rounds each
    found sources my arXiv queries missed, so treat every unsourced or no-paper-found
    claim as not found by these queries, and run broader arXiv API queries (relevance
    order, 8 results) before writing an absence claim. (3) Read the reviewer prompt
    of each tool for what it tells the reviewer to run. (4) BUG-004 reproduced: scripts/record-cycle-time.sh
    removes the --- line from execution-status.yaml; restore it by hand before committing.
    R7 open questions that may become stories for R10: a same-model against different-model
    reviewer test on seeded defects (the one direct test, arXiv 2607.21656, cannot
    separate different from stronger), a fresh against continued reviewer context
    test, mutants as review evidence, and a full-text read of S2, S8, S12, S13, S14
    and S37. Consider items the owner has not decided: the Superpowers fix-loop tier
    rule and cap, bigpowers cap 5 against round N/3, the Claude Code auto-mode fallback
    in -p runs, tighter verify commands for tasks 2, 5 and 6 of e03s02, Claude Code
    /verify, the Claude Code SendMessage review, and Claude Code auto mode in the
    H13 verdict. Use raw URLs, web fetch, git ls-remote or Atom feeds for docs, not
    gh api or api.github.com. Every commit needs a Story: e03s03 trailer.'
