workflow_mode: solo-git
active_flow: build_epic
active_epic: e03
active_story: e03s05
phase: planning
test_plan: lite
vcs:
  kind: git
  branch: main
waivers:
- what: security-review threat model for e01 (build-epic step 0)
  why: No product code. The only executable surface is check-brief.sh, which runs
    verify strings from this repo. Briefs read one outside path, ../pi-flow-legacy,
    which the owner named for R14.
  date: 2026-11-07
  scope: e01 only
- what: plan-consistency-check MED findings (status ledger) for e01s01, e01s02, e01s04
  why: The checker wants failing/passing task statuses. CONVENTIONS.md line 52 sets
    todo, in_progress, done. The owner chose to keep the project convention. Whether
    to adopt the ledger is a question for R2.
  date: 2026-11-08
  scope: e01 only
- what: gate-trace FAIL (rule R1) for e01s03
  why: R1 fails any undone story with 0 code tags. All 14 undone stories have none,
    because the project has no code, so the gate cannot pass until code exists. The
    owner chose to waive it for e01. Oracle links are 96 percent heuristic; completeness-critic
    had 0 blockers; one MEDIUM blind spot (double-tag in e01s03-tasks.yaml, from depends_on)
    was left as is.
  date: 2026-11-08
  scope: e01 only
- what: security-review threat model for e02 (build-epic step 0)
  why: No product code. e02 writes research briefs only; the executable surface is
    check-brief.sh, as in e01. Briefs read web pages, GitHub metadata and the local
    .pi/gsd copy, read only. The owner chose to waive it.
  date: 2026-11-08
  scope: e02 only
- what: gate-trace FAIL (rule R1) for e02s02
  why: R1 fails any undone story with 0 code tags. All 13 undone stories have none,
    because the project has no code. e02s02's matrix links are specs/state.yaml (high,
    explicit tag) and its tasks file (low). The owner chose to waive it for e02, as
    for e01.
  date: 2026-11-08
  scope: e02 only
- what: plan-consistency-check CRITICAL/HIGH findings (missing story specs) and MED
    status-ledger findings for e02s01, e02s02, e02s04
  why: e02s01 and e02s02 are released, so specs written now would be paperwork. e02s04
    gets its spec when it is planned. The owner chose to keep the project status values
    todo, in_progress, done (CONVENTIONS.md), as for e01. Findings for e02s03 itself
    are clear.
  date: 2026-11-08
  scope: e02 only
- what: CONVENTIONS.md rule that gh is used only for PRs and clones (audit-code item)
    for e02s04
  why: The R5 research read host docs and release metadata with gh api. The brief's
    Method says so. The owner accepted the deviation and chose not to re-read the
    sources by raw URL. From now on use raw URLs, web fetch or gh repo clone.
  date: 2026-11-08
  scope: e02s04 only
- what: plan-consistency-check CRITICAL/HIGH findings (missing story specs) for e03s02
    to e03s08
  why: Those seven stories get their specs when each is planned. Planning them now
    would be paperwork. e03s01 itself is clear. The owner chose to waive it for e03,
    as for e02.
  date: 2026-11-08
  scope: e03 only
- what: gate-trace FAIL (rule R1) for e03s01
  why: R1 fails any undone story with 0 code tags. All 9 undone stories have none,
    because the project has no code. The oracle heuristic ratio is 94 percent; completeness-critic
    had 0 blockers; the blind-spot check had 0 HIGH findings. The owner chose to waive
    it for e03, as for e01 and e02.
  date: 2026-11-08
  scope: e03 only
- what: security-review threat model for e03 (build-epic step 0)
  why: No product code. e03 writes research briefs only; the executable surface is
    check-brief.sh and the task verify strings, as in e01 and e02. Briefs read web
    pages, arXiv abstracts and public repository files, read only. The owner chose
    to waive it.
  date: 2026-11-08
  scope: e03 only
- what: CONVENTIONS.md rule of no direct GitHub REST API calls (audit-code item) for
    e03s01
  why: The R6 research session called api.github.com with curl for commit ids and
    dates. The brief's Method says so. Every id and date was re-confirmed with git
    ls-remote, raw URLs at the cited commits and public Atom feeds. The owner accepted
    the deviation. From now on use raw URLs, web fetch, git ls-remote, Atom feeds
    or gh repo clone.
  date: 2026-11-08
  scope: e03s01 only
- what: request-review dual-blind AND-gate for e03s02 (rounds 3 to 5)
  why: Round 1 failed (reviewer A 73.5, reviewer B 80.4) and round 2 failed (A 86.7,
    B 94.8). Each round found real errors in the brief (a wrong claim about which
    reviewers run the declared command, and papers the first searches missed) and
    every finding was checked against its source and fixed. The owner chose to stop
    after round 2 and release. The round-2 fixes (commit 6aafdab) were not re-reviewed.
  date: 2026-11-08
  scope: e03s02 only
- what: request-review dual-blind AND-gate for e03s03 (rounds 4 to 5)
  why: Round 1 failed (reviewer A 71.7, reviewer B 78.1; six must-fix between them).
    Round 2 failed (A 88.2, B 93.1) and round 3 failed (A 93.8, B 82.9), with zero
    must-fix in both rounds; the shortfall was should-fix wording and papers the searches
    missed. Each round found real defects in the brief (a wrong H3 verdict, claims
    stretched past their sources, missed papers) and every finding was checked against
    its source and fixed. New papers kept turning up each round. The owner chose to
    stop after round 3 and release. The round 3 fixes (sources S46 to S51 and wording
    changes) were not re-reviewed.
  date: 2026-11-09
  scope: e03s03 only
- what: CONVENTIONS.md rule of no direct GitHub REST API calls, one request to the
    api.github.com root during e03s04 R9 research
  why: One curl to https://api.github.com was sent while checking the network and
    its output was discarded. Nothing in the brief depends on the response, and the
    Method section of docs/research/R9-model-routing.md discloses it. The request
    cannot be undone. The owner accepted the deviation on 2026-11-09 and asked for
    the waiver to be recorded. Going forward, use raw URLs, web fetch, git ls-remote
    or gh repo clone.
  date: 2026-11-09
  scope: e03s04 only
- what: CONVENTIONS.md rule that every source has a publication date, for 12 vendor
    doc and repository pages in the R9 brief (S42 to S50, S52 to S54)
  why: These pages show no publication date. The server Last-Modified header for the
    Claude Code pages is the fetch-day cache or deploy time (2026-11-09), not a publication
    date. Each source line records the version or commit read, or the header value.
    A real date cannot be found, so the brief marks them as undated. check-brief.sh
    passes with a warning. The owner approved this exception on 2026-11-09.
  date: 2026-11-09
  scope: e03s04 only (docs/research/R9-model-routing.md sources S42 to S50, S52 to
    S54, and S69 added 2026-11-09)
- what: request-review AND-gate for e03s04 (rounds 1 to 5)
  why: Every round failed both reviewers (round 1 A 82.0 and B 87.5; round 2 74.0
    and 73.3; round 3 81.7 and 79.1; round 4 90.2 and 87.5; round 5 85.7 and 84.6).
    The five-round cap was reached. Each round's must-fix items were fixed, and the
    round-5 must-fix items were fixed after the cap. The should-fix wording items
    from round 5 were not fixed and are accepted as a waiver. The owner chose this
    option on 2026-11-09.
  date: 2026-11-09
  scope: e03s04 only (docs/research/R9-model-routing.md wording only; no change to
    verify commands)
- what: regression test for the cycle-time marker, previously not run by CI or Preflight
  why: Resolved 2026-11-09. The owner chose CI, not Preflight, so the Preflight command
    in CLAUDE.md and CONVENTIONS is unchanged. The test now runs as a CI step, and
    CONVENTIONS documents it.
  date: 2026-11-09
  scope: tools/test-record-cycle-time.sh only
- what: gate-trace FAIL (rule R1) for e03s05 to e04s03, CONCERNS (rule R2) for e01s02
    and e01s04, CONCERNS (rule R4) and oracle downgrade (95 percent heuristic links),
    for the e03s04 release
  why: R1 fails any undone story with no code tags. The project has no product code,
    so no undone story can have one. R2 for missing verify evidence, e01s02 and e01s04
    were released before verify evidence was written for them. R4 for coverage, 2
    of 19 stories are tagged. oracle downgrade on 41 of 43 links come from file and
    task heuristics. The owner approved this waiver on 2026-11-09.
  date: 2026-11-09
  scope: e03s04 release only (stories e03s05 to e03s08 and e04s01 to e04s03 for R1;
    e01s02 and e01s04 for R2)
- what: CONVENTIONS.md rule that every source has a publication date, for 4 vendor
    doc pages in the R11 brief (S26 to S29, Claude Code sandboxing, permissions and
    security, and Codex agent-approvals-security)
  why: These pages show no publication date, and none could be found. Each source
    line records the installed version read. A real date cannot be found, so the brief
    marks them as undated. check-brief.sh passes with a warning. R5 cited the same
    pages as undated. The owner approved this exception on 2026-11-09.
  date: 2026-11-09
  scope: e03s05 only (docs/research/R11-security-permissions.md sources S26 to S29)
handoff:
  next_skill: request-review
  next_story: e03s05
  note: 'e03s05 (R11 security and permissions, 5 BCPs) has its brief drafted on branch
    e03s05-r11-security-permissions: docs/research/R11-security-permissions.md (32
    sources, 24 papers read as abstracts, H21 to H23 all refined). All 8 tasks pass
    their verify commands. Next: verify-work, then audit-code, then request-review
    capped at 2 rounds (the main risk is numbers stretched past abstracts; ask a reviewer
    to check claims against full texts). Spec: specs/epics/e03-design-topics/e03s05-r11-security-permissions.md.
    Owner decisions 2026-11-09: H21, H22 and H23 added to planning-context.yaml for
    R11 (every H1-H20 reference in specs/ now says H1-H23), and R11 reviews evidence
    only, no measurement. plan-consistency-check findings for e03s06 to e03s08 are
    covered by the e03 waiver. Open for the owner, carried over: the audit skill verify
    checks skills/ dirs that do not exist; the gitignored traceability matrix regenerates
    with bash scripts/trace-stories.sh --json; undecided R7 items; e04s02 takes the
    stack choice. Every commit needs a Story trailer. Record cycle time through tools/record-cycle-time.sh.'
