handoff:
  next_skill: kickoff-branch
  next_story: e03s08
  note: >-
    e03s07 (R13 enforcement design, 8 BCPs) is released by the pull request
    whose squash commit is the head of main. Brief:
    docs/research/R13-enforcement-design.md (59 sources; verdicts H2, H4,
    H5, H6, H7, H16 and H27 all refined). Hypotheses now run H1 to H27.
    Recorded waivers: the request-review gate (two rounds, both failed,
    fixes not re-reviewed), the undated-source exception for S25 to S29 and
    S56 and S59, and gate-trace for this release. The e03s07 cycle-time row
    is recorded (2.14 h effort, 18 commits). Next is kickoff-branch for
    e03s08 (R15 run termination for autonomous loops, 5 BCPs), in a fresh
    session. Start the branch with git checkout -b in this checkout, not a
    worktree (BUG-002). e03s08 has a tasks file (three placeholder tasks)
    and no story spec, so plan-work follows kickoff-branch, as for e03s05 to
    e03s07; the plan-consistency CRITICAL and HIGH findings for the missing
    spec are covered by the e03 waiver. active_story in this file still
    reads e03s07 until kickoff-branch sets it. Inputs for R15 from R13: the
    Bounded Loops paper (arXiv:2609.27871, full text read in R13) gives a
    budget ceiling enforced inside an attempt and a gate verdict before done
    as the two enforced stop conditions, with the caveat that its 47 vacuity
    defects are in the authors own 69-loop catalogue; the Code as Agent
    Harness survey (arXiv:2605.18747) says termination should be governed by
    verification, not model confidence; R12 lists context ceilings as a stop
    condition; in Claude Code a Stop hook exit 2 sends the agent back to
    work and onFailure has no effect on Stop hooks, so a Stop gate that
    cannot start does not stop a loop. R15 also owns the two unverified
    leads from R0, arXiv:2604.08224 and arXiv:2607.00038. Lessons from
    e03s07 for the next brief: search the full text of a source with several
    plain keywords before writing a not found or unsourced claim (it caused
    most of the review errors, twice); never cut grep output before reading
    it; read the full text of every paper whose number carries a verdict;
    run plain arXiv queries as well as narrow ones; commit in steps. Open
    for the owner, carried over: BUG-005 (the global scripts rewrite YAML
    state files in a different style) is fixed in the repo by
    tools/restore-yaml-style.py once the fix branch merges: run it with
    --base HEAD on specs/state.yaml after the last bp-timing.sh call, and
    tools/record-cycle-time.sh now does it for execution-status.yaml (see
    CONVENTIONS); undecided R7 items; e04s02 takes the stack choice; four
    R11 papers left unread (arXiv:2609.39678, 2610.02456, 2603.10387 and
    2608.25817); R13 papers read only to the abstract (listed in the brief).
    The gate-trace waiver covers one release at a time. Every commit needs a
    Story trailer. Record cycle time through tools/record-cycle-time.sh with
    --file specs/metrics/cycle-times.md and take the SHA range before the
    squash merge.
