# Status uses CONVENTIONS.md values: todo, in_progress, done.
# slice-tasks 2026-11-12. The engine can check that the hook is live
# and fails loudly when it is not (SYNTHESIS, "Engine and adapters").
# This closes the residual from e07s02: a Stop hook that never starts
# is not blocked by any host option, so it is found by a check.
# Two layers, neither one spends model tokens:
#   static: the settings file holds the Stop entry, it names an
#     adapter file that exists, and the host's disableAllHooks switch
#     is not on in the project's settings;
#   evidence: the adapter writes one heartbeat line to the ledger in
#     the git dir each time the host calls it, and the check reports
#     the time of the last one. A registered hook with no heartbeat
#     is reported as "not seen", not as live.
# Managed settings can switch hooks off and sit outside the
# repository; the check says what it could not read (e10 reports the
# per-host boundary). Not a trial on a real host: no source
# measured it, and a trial costs tokens, which the owner has not
# capped (release-plan, B7).
story_id: e07s04
title: Check that the hook is live, and fail loudly when it is not
status: todo
bcps: 5
