# Status uses CONVENTIONS.md values: todo, in_progress, done.
# slice-tasks 2026-11-12; plan-work 2026-11-12 (spec:
# e07s04-live-check.md). The check says whether the Stop hook is live
# and fails loudly when it is not. It closes the e07s02 residual: a
# Stop hook that never starts is not blocked by any host option.
# Owner decisions at plan-work (all three recommendations taken):
#   1. The adapter records each call in its own file,
#      <git dir>/weftwork/last-call.json, not as a ledger line.
#   2. Live means the last call used the same adapter path and
#      command as an entry in the settings now. Age is printed only.
#   3. The check reads local, project and user settings and applies
#      precedence for disableAllHooks. Managed settings and the
#      --settings flag are named as not read.
# No model tokens are spent except in the owner's run (task 5).
