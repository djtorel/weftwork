# Status uses CONVENTIONS.md values: todo, in_progress, done.
# slice-tasks 2026-11-12; plan-work 2026-11-12 (spec:
# e07s02-fail-closed-faults.md). Claude Code treats only exit 2 as a
# block: a hook that throws, times out or prints invalid JSON lets the
# stop go ahead (R13 S25). So every fault of the adapter's own must end
# in exit 2 with a reason. A Stop hook that cannot start at all is not
# fixed here; the e07s04 liveness check closes that residual.
# Host facts (hooks docs, read 2026-11-12): the default hook timeout is
# 600 s, a timed-out hook is cancelled with its output discarded.
# Owner decisions (2026-11-12, three questions, each the recommended
# option): (1) engine timeout 600 s, hook entry timeout 660 s, both as
# exported constants that e07s03 reads; (2) faults Claude cannot fix keep
# exit 2 with an honest message; (3) one story, resized from 3 to 5 BCPs
# (epic 18 to 20; WSJF not rescored).
# Changed from the slice: four tasks, not two. Tests use temporary
# directories and never this repository's ledger.
story_id: e07s02
title: The adapter fails closed on every fault of its own
