      printf '%s\n' "$F" | grep -q '^- '
      && ! printf '%s\n' "$F" | grep -Eivq '\[S[0-9]+\]|unsourced'
      && printf '%s\n' "$F" | grep -iq 'completion'
      && printf '%s\n' "$F" | grep -iq 'dual exit'
      && printf '%s\n' "$F" | grep -iq 'exit signal'
