  - id: 7
    description: >-
      Write Stop conditions compared: one table with columns
      Condition, Enforced by, What it stops, Failure mode, Evidence; at
      least seven rows including Model done claim, Verified completion
      gate, Dual exit check, Budget ceiling, Context ceiling, Rate
      limit and Circuit breaker; no empty cell; every row cites [S<n>]
