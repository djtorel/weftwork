      engine, CI, human), not a product
    verify: >-
      B=docs/research/R15-run-termination.md;
      M=$(awk '$0=="## Stop conditions compared"{f=1;next}
      /^## /{f=0} f' "$B");
      printf '%s\n' "$M" | grep -m1 -E '^\| *Condition *\|'
      | grep -Ei '\| *Enforced by *\|'
      | grep -Ei '\| *What it stops *\|'
      | grep -Ei '\| *Failure mode *\|' | grep -Eiq '\| *Evidence *\|'
      && R=$(printf '%s\n' "$M" | grep -E '^\|'
      | grep -Ev '^\| *Condition *\|' | grep -Ev '^\|[ :|-]+\|$')
      && test "$(printf '%s\n' "$R" | grep -c .)" -ge 7
      && printf '%s\n' "$R" | awk -F'|' '{for(i=2;i<=6;i++)
      if($i~/^ *$/)b=1; if(NF!=7)b=1} END{exit b}'
      && ! printf '%s\n' "$R" | grep -Eivq '\[S[0-9]+\]|unsourced'
      && for t in 'Model done claim' 'Verified completion gate'
      'Dual exit check' 'Budget ceiling' 'Context ceiling' 'Rate limit'
      'Circuit breaker'; do
      printf '%s\n' "$R" | grep -Eiq "^\| *\**$t"
      || { echo "missing row: $t"; exit 1; }; done
