  - id: 2
    description: >-
      Write the Method section: access date, the version, release or
      commit read for each tool, whether any page came through a
      summarizing subagent, and that no workflow was run (the verify
      checks the date and the words commit or version, subagent and
      workflow)
    verify: >-
      M=$(awk '$0=="## Method"{f=1;next} /^## /{f=0} f'
      docs/research/R7-review-and-decisions.md);
      printf '%s\n' "$M" | grep -Eq '[0-9]{4}-[0-9]{2}-[0-9]{2}'
      && printf '%s\n' "$M" | grep -Eiq 'commit|version'
      && printf '%s\n' "$M" | grep -Eiq 'subagent'
      && printf '%s\n' "$M" | grep -Eiq 'workflow'
    risk: P2
    status: done
    allure:
      severity: normal
      categories:
        - "Research brief"
        - "Wave 3"
  - id: 3
    description: >-
      Write Review practices: one table with columns Tool, Reviewer,
      Context, Model, Evidence checked, Escalation; at least six rows
      including Claude Code, Codex CLI, GSD, bigpowers, Superpowers
      and BMAD; no empty cell; every row cited
    verify: >-
      B=docs/research/R7-review-and-decisions.md;
      M=$(awk '$0=="## Review practices"{f=1;next} /^## /{f=0} f'
      "$B");
      printf '%s\n' "$M" | grep -m1 -E '^\| *Tool *\|'
      | grep -Ei '\| *Reviewer *\|' | grep -Ei '\| *Context *\|'
      | grep -Ei '\| *Model *\|' | grep -Ei '\| *Evidence checked *\|'
      | grep -Eiq '\| *Escalation *\|'
      && R=$(printf '%s\n' "$M" | grep -E '^\|'
      | grep -Ev '^\| *Tool *\|' | grep -Ev '^\|[ :|-]+\|$')
      && test "$(printf '%s\n' "$R" | grep -c .)" -ge 6
      && printf '%s\n' "$R" | awk -F'|' '{for(i=2;i<=7;i++)
      if($i~/^ *$/)b=1; if(NF!=8)b=1} END{exit b}'
      && ! printf '%s\n' "$R" | grep -Evq '\[S[0-9]+\]'
      && for t in 'Claude Code' 'Codex CLI' GSD bigpowers Superpowers
      BMAD; do printf '%s\n' "$R" | grep -Eiq "^\| *\**$t\**"
      || { echo "missing row: $t"; exit 1; }; done
    risk: P2
    status: done
    allure:
      severity: normal
      categories:
        - "Research brief"
        - "Wave 3"
  - id: 4
    description: >-
      Write Self-agreement: cited bullets on why a model that reviews
      or judges its own output agrees with it (self-preference), and
      on the mitigations (a different model, a fresh context), as
      input to the H13 verdict
    verify: >-
      F=$(awk '$0=="## Self-agreement"{f=1;next} /^## /{f=0}
      f&&/^- /{if(b)print b;b=$0;next} f&&/^  /{b=b" "$0}
      END{if(b)print b}' docs/research/R7-review-and-decisions.md);
      printf '%s\n' "$F" | grep -q '^- '
      && ! printf '%s\n' "$F" | grep -Evq '\[S[0-9]+\]'
      && printf '%s\n' "$F"
      | grep -Eiq 'self-(preference|agreement|bias|enhancement)'
      && printf '%s\n' "$F"
      | grep -Eiq 'different model|heterogene|cross-model'
      && printf '%s\n' "$F" | grep -Eiq 'fresh context|clean context'
    risk: P2
    status: done
    allure:
      severity: normal
      categories:
        - "Research brief"
        - "Wave 3"
