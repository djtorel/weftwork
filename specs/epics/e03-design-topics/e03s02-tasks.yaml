      B=docs/research/R7-review-and-decisions.md;
      bash tools/check-brief.sh "$B" R7 --sources
      && test "$(awk '$0=="## Sources"{f=1;next} /^## /{f=0} f' "$B"
      | grep -E '^- \[S[0-9]+\]' | grep -Eic 'arxiv\.org|doi\.org')"
