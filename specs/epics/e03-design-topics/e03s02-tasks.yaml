  - id: 7
    description: >-
      Add verdicts (confirmed/refined/refuted, with sources)
      for every hypothesis assigned to R7 in planning-context.yaml
      (H1, H13, H14), plus implications for weftwork, earns-its-place
      vs ceremony verdicts, and open questions
    verify: >-
      B=docs/research/R7-review-and-decisions.md;
      bash tools/check-brief.sh "$B" R7
      && for h in Sources Method 'Review practices' 'Self-agreement'
      'Evidence in review' 'Decisions and escalation' Verdicts
      'Implications for weftwork' 'Earns its place vs ceremony'
      'Open questions'; do
      awk -v h="## $h" '$0==h{f=1;next} /^## /{f=0} f' "$B"
      | grep -q '[^[:space:]]' || { echo "empty section: $h"; exit 1; };
      done
      && U=$(grep -Eo '\[S[0-9]+\]' "$B" | sort -u)
      && L=$(awk '$0=="## Sources"{f=1;next} /^## /{f=0} f' "$B"
