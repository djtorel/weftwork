    verify: >-
      F=$(awk '$0=="## Evidence in review"{f=1;next} /^## /{f=0}
      f&&/^- /{if(b)print b;b=$0;next} f&&/^  /{b=b" "$0}
      END{if(b)print b}' docs/research/R7-review-and-decisions.md);
      printf '%s\n' "$F" | grep -q '^- '
      && ! printf '%s\n' "$F" | grep -Eivq '\[S[0-9]+\]|unsourced'
      && printf '%s\n' "$F" | grep -iq 'mutation'
      && printf '%s\n' "$F" | grep -Eiq 'tests? (run|ran|pass)|test suite'
    risk: P2
    status: done
    allure:
      severity: normal
      categories:
        - "Research brief"
        - "Wave 3"
