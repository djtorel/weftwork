---
# Status uses CONVENTIONS.md values: todo, in_progress, done.
# slice-tasks 2026-11-11. Last in e05: the required check name must
# stay stable, so CI is final first. Tasks 2 and 3 change GitHub
# settings (outward-facing); each needs the owner's go-ahead.
# CONVENTIONS.md limits gh to PRs and clones, and these tasks use
# gh api. The owner allowed gh api for e05s04 on 2026-11-11 ("do your
# recommendations"); task 2 records the waiver. The owner also chose
# then that the PR template lists the gates and carries no provenance
# marker. The settings change in task 3 still needs a go-ahead at
# the time it runs.
story_id: e05s04
title: PR template and protected main
status: todo
bcps: 3
type: chore
context: infra
risk: P2
depends_on: [e05s01, e05s02, e05s03]
tasks:
  - id: 1
    description: >-
      Write .github/pull_request_template.md: Summary, Story id,
      Gates (name each gate that passed, was waived, was stale or was
      missing: audit, security review, gate-trace), and Verify output.
      It carries no bigpowers provenance marker (AGENTS.md Flow
      Discipline bans it; this replaces the epic's done_when wording)
    verify: >-
      T=.github/pull_request_template.md && test -f "$T"
      && for h in Summary Story Gates Verify; do
      grep -Eiq "^#+ .*$h" "$T" || { echo "missing: $h"; exit 1; };
      done && ! grep -Eiq 'provenance|co-authored|generated (by|with)'
      "$T"
    risk: P3
    status: todo
    allure:
      severity: normal
  - id: 2
    description: >-
      Record the owner's 2026-11-11 exception that allows gh api for
      this story (setting and reading branch protection) in
      state.yaml waivers, scope e05s04 only, in the same form as
      earlier gh exceptions
    verify: >-
      python3 -I -c "import yaml;
      d=yaml.safe_load(open('specs/state.yaml'));
      assert any('e05s04' in str(w.get('scope')) and 'gh' in w['what']
      for w in d['waivers'])"
    risk: P3
    status: todo
    allure:
      severity: normal
  - id: 3
    description: >-
      After the owner's go-ahead, protect main: pull request required,
      the CI job named checks required and up to date, force pushes
      and deletion blocked. Approvals required stay at 0 (one owner).
      Whether admins are exempt is the owner's call at that point
    verify: >-
      P=$(gh api repos/{owner}/{repo}/branches/main/protection)
      && printf '%s\n' "$P"
      | python3 -I -c "import json,sys; d=json.load(sys.stdin);
      c=d['required_status_checks']['contexts'];
      assert 'checks' in c, c;
      assert d['required_pull_request_reviews'] is not None;
      assert not d['allow_force_pushes']['enabled'];
      assert not d['allow_deletions']['enabled']"
    risk: P2
    status: todo
    allure:
      severity: high
