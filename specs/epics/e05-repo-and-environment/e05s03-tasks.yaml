# slice-tasks 2026-11-11. CONVENTIONS.md line 4 says to add the
# code-style and test sections when the stack is chosen. It is chosen.
# plan-work 2026-11-11 (owner chose each recommended option): Build
# row is npm run typecheck; Run row stays N/A until e06 ships the CLI;
