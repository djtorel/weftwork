---
# Status uses CONVENTIONS.md values: todo, in_progress, done.
# slice-tasks 2026-11-11. Tracer: CI runs the project's own validator.
# plan-work 2026-11-11: selftest first (RED), then the port (GREEN).
# The port also checks capsule_dir (owner decision 2026-11-11).
story_id: e05s01
title: Port the specs validator into tools/ and run it in CI
status: in_progress
bcps: 3
type: chore
context: infra
risk: P2
spec: e05s01-port-specs-validator.md
tasks:
  - id: 1
    description: >-
      RED. Write tools/test-validate-specs-yaml.sh. It builds trees in
      mktemp -d (never in the repo) and removes them on exit. The good
      tree passes first (anti-vacuity). Then one break per case:
      corrupt epic.yaml, missing active_flow, missing release.version,
      epics: [], missing development_status, epic file that does not
      exist, capsule_dir that does not exist, capsule_dir with no
      epic.yaml; each exits 1 and names the file. Broken YAML under
      verifications/fixtures/ is skipped (exit 0). Run it once before
      task 2 and record the failure as RED evidence
    verify: >-
      test -x tools/test-validate-specs-yaml.sh
      && bash -n tools/test-validate-specs-yaml.sh
    risk: P2
    status: done
    allure:
      severity: normal
      categories:
        - "unit"
        - "e05 wave 5"
  - id: 2
    description: >-
      GREEN. Write tools/validate-specs-yaml.sh, a port of bigpowers
      2.93.3 scripts/validate-specs-yaml.sh with its MIT notice. Keep
      the optional specs-dir argument, the parse pass, the fixture
      skip and the required-key checks. Use ${PYTHON:-python3} instead
      of lib/python-env.sh. Check epics[].file and
      epics[].capsule_dir (directory with epic.yaml)
    verify: >-
      test -x tools/validate-specs-yaml.sh
      && bash tools/test-validate-specs-yaml.sh
      && bash tools/validate-specs-yaml.sh
      | grep -q 'validate-specs-yaml: OK'
    risk: P2
    status: done
    allure:
      severity: normal
      categories:
        - "unit"
        - "e05 wave 5"
  - id: 3
    description: >-
      Add two CI steps (the validator and its selftest) to
      .github/workflows/ci.yml, and change the Preflight text in
      AGENTS.md and CONVENTIONS.md from scripts/validate-specs-yaml.sh
      to tools/validate-specs-yaml.sh. Every command in AGENTS.md must
      still resolve
    verify: >-
      yamllint .github/workflows/ci.yml
      && grep -q 'tools/validate-specs-yaml.sh' .github/workflows/ci.yml
      && grep -q 'tools/test-validate-specs-yaml.sh'
      .github/workflows/ci.yml
      && ! grep -q 'scripts/validate-specs-yaml' AGENTS.md CONVENTIONS.md
      && yamllint specs && bash tools/validate-specs-yaml.sh
      && bash tools/check-gate-ignores.sh
    risk: P3
    status: done
    allure:
      severity: minor
      categories:
        - "ci"
        - "e05 wave 5"
