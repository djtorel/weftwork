        - "e05 wave 5"
  - id: 2
    description: >-
      GREEN. Write tools/setup.sh for the Python tools. Install PyYAML
      and yamllint with python3 -m pip only when one is missing; if
      pip refuses (PEP 668), exit 1 and name the fix. --check installs
      nothing and names each missing tool. Safe to run twice
    verify: >-
      test -x tools/setup.sh && bash tools/test-setup.sh
      && bash tools/setup.sh && bash tools/setup.sh
      && bash tools/setup.sh --check
    risk: P2
    status: todo
    allure:
