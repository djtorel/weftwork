# Status uses CONVENTIONS.md values: todo, in_progress, done.
# slice-tasks 2026-11-13; plan-work 2026-11-13. The engine owns a
# small documented field set and refuses everything else (R12:
# "keep the field set small and documented"). The writer of e08s01
# can change any key; this story limits what the engine lets a
# caller change, so the file keeps a shape a session with no memory
# can read.
# Owner decisions (2026-11-13, plan-work; all four recommendations
# taken; spec e08s02-state-fields.md section 1):
#   1. The engine owns active_flow, active_epic, active_story, phase
#      and vcs.branch. handoff is e08s03. The rest stays byte-for-byte.
#   2. Type-only checks: text or null, one line, 200 code points.
#   3. One exported write function (setStateField); no writer grep.
#   4. The state CLI takes no "file"; it uses specs/state.yaml.
story_id: e08s02
spec: e08s02-state-fields.md
title: The engine changes only the documented state fields
status: in_progress
bcps: 4
type: feat
context: engine
risk: P1
tasks:
