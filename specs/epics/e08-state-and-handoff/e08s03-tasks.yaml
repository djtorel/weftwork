---
# Status uses CONVENTIONS.md values: todo, in_progress, done.
# slice-tasks 2026-11-13. The engine writes the handoff for a session
# that remembers nothing. R12: write it for a session with no memory,
# keep it bounded, and have it carry what resume can verify. The
# facts the engine can know (when it was written, which paths were
# uncommitted) it fills itself, so the agent cannot get them wrong.
# Open for plan-work (recommendation first):
#   1. The handoff block holds next_skill, next_epic, next_story, note
#      and branch (the branch the next session should start on), and
#      files (paths the note names). The engine adds written_at and
#      uncommitted (git status paths at write time, without the state
#      file itself). Required from the caller: next_skill, note and
#      branch. next_epic and next_story may be null.
#   2. The note is capped at 4000 characters. The existing notes run
#      1300 to 1700. The one handoff study put 10k characters of
#      structured notes in the first prompt (R12, S36), so 4000 is
#      inside what was tested. A longer note is refused, not cut.
#   3. No commit hash is recorded. This repository squash-merges every
#      PR, so a hash written on a story branch does not exist on main
#      where the next session starts. e08s04 checks the branch and the
#      files instead.
#   4. One file, not two. R12 calls HANDOFF.json plus a .continue-here
#      file ceremony until one file is shown to be not enough.
story_id: e08s03
title: The engine writes the handoff note for a session with no memory
status: todo
bcps: 5
