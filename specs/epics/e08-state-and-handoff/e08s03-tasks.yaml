# Status uses CONVENTIONS.md values: todo, in_progress, done.
# slice-tasks 2026-11-13. The engine writes the handoff for a session
# that remembers nothing. R12: write it for a session with no memory,
# keep it bounded, and have it carry what resume can verify. The
# facts the engine can know (when it was written, which paths were
# uncommitted) it fills itself, so the agent cannot get them wrong.
# Owner decisions (plan-work 2026-11-13; all five recommendations
# taken): see e08s03-handoff.md section 1. Fields, a 4000-character
# note cap, no commit hash, one file, and a new writer edit that
# replaces one top-level mapping (the e08s01 writer cannot add keys or
# lists). Decision 5 raised the story from 5 to 7 BCPs.
spec: e08s03-handoff.md
story_id: e08s03
title: The engine writes the handoff note for a session with no memory
status: in_progress
bcps: 7
type: feat
context: engine
risk: P1
tasks:
