    description: >-
      RED, then GREEN. Write src/handoff.test.ts first and record the
      failure. Cases: a complete input gives a handoff block with
      written_at and uncommitted filled in by the engine; a missing
      next_skill, note or branch, a note over 4000 characters, a file
      path that does not exist in the repository, a path outside it
      and a path with a newline are each refused with an error that
      names the problem and leave the text unchanged; a caller who
      sends written_at or uncommitted has them ignored. Then write
      src/handoff.ts. The git facts come from the same git helper
      style as src/tree.ts (git run with core.fsmonitor=false); do not
      add a second way to call git
    verify: >-
      node --test src/handoff.test.ts && npm run typecheck
