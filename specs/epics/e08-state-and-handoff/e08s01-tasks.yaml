# Status uses CONVENTIONS.md values: todo, in_progress, done.
# slice-tasks 2026-11-13; plan-work 2026-11-13 (spec:
# e08s01-state-writer.md). Tracer bullet for B2: a caller names one
# field of a state file, the engine changes that field on disk, and
# nothing else in the file changes. This is the format-preserving
# writer of R12 and R13, and the answer to BUG-001, BUG-004 and
# BUG-005 (tools rewrote specs/state.yaml and specs/execution-status.yaml
# in another style, three times).
# Owner decisions at plan-work (all four recommendations taken):
#   1. yaml 2.9.1 and its CST layer (Parser, CST.setScalarValue,
#      CST.stringify), not the Document API: the spike showed
#      parseDocument().toString() rewrites 495 lines of state.yaml,
#      and the CST round trip keeps every byte of four spec files.
#   2. No folding of long values in this story; e08s03 decides.
#   3. Move the regular-file read and the atomic write out of
#      src/claude-settings-file.ts into src/regular-file.ts and share
#      them.
#   4. Missing-spec and gate-trace R1 waivers for e08 only, as for e07.
# Prior art in this repo: tools/restore-yaml-style.py puts old text back
# after another tool rewrote a file. This story makes the rewrite not
# happen. It does not replace that tool: the global scripts
# (bp-timing.sh, record-cycle-time.sh) still write the same files.
