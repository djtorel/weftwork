  - id: 3
    description: >-
      Write the Capability matrix: one row per capability (hooks,
      subagents, skills, plugins, worktrees, ask-user path,
      per-dispatch model, per-dispatch effort, instruction files,
      skill files), one column per host (pi, Claude Code, opencode,
      Codex CLI, Gemini CLI), no empty cell, every row cited
    verify: >-
      B=docs/research/R5-harness-capabilities.md;
      C='Hooks|Subagents|Skills|Plugins|Worktrees|Ask-user path';
      C="$C|Per-dispatch model|Per-dispatch effort";
      C="$C|Instruction files|Skill files";
      M=$(awk '$0=="## Capability matrix"{f=1;next} /^## /{f=0} f' "$B");
      printf '%s\n' "$M" | grep -m1 -E '^\| *Capability *\|'
      | grep -Ei '\| *pi *\|' | grep -Ei '\| *Claude Code *\|'
      | grep -Ei '\| *opencode *\|' | grep -Ei '\| *Codex CLI *\|'
      | grep -Eiq '\| *Gemini CLI *\|'
      && printf '%s\n' "$M" | grep -E "^\| *\**($C)\** *\|"
      | awk -F'|' '{for(i=2;i<=7;i++)if($i~/^ *$/)b=1;if(NF<8)b=1}
      END{exit b}'
      && printf '%s\n' "$M" | grep -E "^\| *\**($C)\** *\|"
      | grep -E '\[S[0-9]+\]' | grep -Eo "^\| *\**($C)"
      | tr -d '|*' | sed 's/^ *//' | sort -u | wc -l | tr -d ' '
      | grep -qx 10
    risk: P2
    status: done
    allure:
      severity: normal
      categories:
        - "Research brief"
        - "Wave 2"
