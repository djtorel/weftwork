      AC-02) and record the failure. Then write src/states.ts: the five
      terminal states as a string-literal union (no enum; CONVENTIONS.md
      erasable syntax), State as those five plus failed, and one table
      that maps each state to a distinct exit code (done 0, failed 1,
      blocked 3, stalled 4, exhausted 5, killed 6), with bad input 2. A
      test asserts that no state other than done maps to 0 and that
      every exit code is unique
    verify: >-
      node --test src/states.test.ts && npm run typecheck
    risk: P1
    status: done
    allure:
      severity: high
      categories:
