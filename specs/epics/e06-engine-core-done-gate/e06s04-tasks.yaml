# Status uses CONVENTIONS.md values: todo, in_progress, done.
# slice-tasks 2026-11-11. Five terminal states: done (verified),
# blocked, stalled, exhausted and killed, each logged with its counters
# (R15 [S1][S3]). An error or an exhausted budget never counts as
# done. The no-progress breaker keys on evidence that can move, and it
# must be shown to trip and to stay quiet (R15 [S14]). Thresholds are
# tunable defaults, not findings. The per-repository budget setting and
# the engine-counted ceilings over the whole loop belong to e09 (B5);
# this story holds only the simplest ceiling, a cap on failed runs.
# plan-work 2026-11-12: spec written, four owner decisions (all the
# recommended option). (1) The stall key is command, tree fingerprint,
# reason and exit code, not output: the engine captures none, and test
# runners print timings that change every run. (2) Exit codes 0 done,
# 1 failed (not terminal, as today), 2 bad input, 3 blocked, 4 stalled,
# 5 exhausted, 6 killed. (3) Exhausted is enforced before the run: at
# the ceiling the engine does not run the command, so no later pass can
# undo it; the owner deletes the ledger to restart. (4) A signal kills
# the process group with SIGKILL. The tasks are split from five to
# seven plus a closing step, since the ledger, the engine and the signal
# plumbing each needed their own RED. Threat model controls C3, C4, C7,
# C8 and C10 apply; F3 (cap the ledger read) is task 2.
story_id: e06s04
title: Name the five terminal states and trip a no-progress breaker
status: todo
bcps: 5
type: feat
context: engine
