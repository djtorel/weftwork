# Status uses CONVENTIONS.md values: todo, in_progress, done.
# slice-tasks 2026-11-14. A ceiling over the whole loop. Today the
# only ceiling is maxFailures: failures in a row of one exact command
# string, so an agent that changes the command, or passes once, starts
# again from zero. R15 asks for a ceiling the engine counts over the
# whole loop, the outer cycle as well as each attempt, and not one
# that relies on a host cap or the model's judgment [S3][S5][S18].
# After this story an optional loop ceiling counts every gate run,
# for any command, since the loop started, and answers exhausted when
# it is reached. It is off by default: stopping a run on a budget is
# off by default (SYNTHESIS, budget setting), so only an owner setting
# turns it on.
# delta ADDED.
# Open choices for plan-work, each with a recommendation:
#   1. When a loop starts. Recommend: after the last done verdict in
#      the ledger (or the start of the ledger), so each done opens a
#      new loop. Counted from the ledger, which the engine already
#      writes for every verdict.
#   2. The key name and range. Recommend maxRuns, an integer from 1
#      to 1000, in the e09s01 budget setting; absent means off.
#   3. Residual F5 (specs/security/REVIEW.md): an unreadable ledger
#      turns every stop rule off. Recommend: when maxRuns is set and
#      the ledger cannot be read, answer exhausted and do not run,
#      because the ceiling cannot be counted. Without maxRuns the
#      behaviour stays as it is (AC-28 of e06). The owner decides.
# plan-work 2026-11-14: the owner took all three recommendations.
# Spec: e09s02-loop-ceiling.md.
