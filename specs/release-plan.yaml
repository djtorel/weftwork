---
# Release index. Story status lives in execution-status.yaml, not here.
# Order = execution order. Dependencies override raw WSJF: e04 scores
# higher than e02 and e03 but needs both, so it runs last.
release:
  version: "0.1.0"          # label only; no code ships in this release
  codename: Research program
  status: planning
  semantic_release: false
  bump_hint: patch

# WSJF = (business value + time criticality + risk reduction) / size,
# each 1-10. Size follows BCPs. These scores are estimates by the
# planner, not measurements; revise them with change-request.
epics:
  - id: e01
    title: Foundations (wave 1)
    wsjf: 6.25              # (8 + 8 + 9) / 4; not rescored for s04
    bcps: 14
    risk: P1
    depends_on: []
    capsule_dir: epics/archive/e01-foundations
    note: >-
      Builds the brief checker and can reshape later epics, so it runs
      first and ends in a re-plan checkpoint. Done and archived by
      change-request 2026-11-08.
  - id: e02
    title: Tools and hosts (wave 2)
    wsjf: 3.6               # (7 + 5 + 6) / 5
    bcps: 14
    risk: P2
    depends_on: [e01]
    capsule_dir: epics/archive/e02-tools-and-hosts
    note: >-
      Done and archived by release-branch for e02s04, 2026-11-08.
  - id: e03
    title: Design topics (wave 3)
    wsjf: 1.6               # (6 + 4 + 6) / 10; not rescored for e03s07
    bcps: 44
    risk: P2
    depends_on: [e02]
    capsule_dir: epics/archive/e03-design-topics
    note: >-
      Rescored by change-request 2026-11-08 after the e01 re-plan
      checkpoint: new R15 story, and added topics or tasks in R7, R9,
      R11 and R12. Close to the 1.5 cut threshold; the R15 story is the
      first to cut if the research program needs to shrink. A second
      change request on the same day moved two R5 and R3 candidates into
      e03s07 (R13) with no BCP change: locate the "Code as Agent
      Harness" survey and read Kiro's steering and hooks pages.
      Done and archived by release-branch for e03s08, 2026-11-10.
  - id: e04
    title: Evaluation and synthesis (wave 4)
    wsjf: 3.8               # (7 + 4 + 8) / 5
    bcps: 16
    risk: P2
    depends_on: [e03]
    capsule_dir: epics/archive/e04-evaluation-synthesis
    note: >-
      Highest raw WSJF after e01, but it needs a candidate workflow and
      every earlier brief, so it stays last. Rescored by change-request
      2026-11-08: new R16 evidence-refresh story that runs before the
      synthesis (skill listing cost, .agents/skills runtime test, BMAD v7
      re-check). Time criticality 3 to 4 for the dated BMAD v7 re-check,
      job size 4 to 5. Story-level WSJF for R16 is (5 + 5 + 5) / 5 = 3.0.
      Put in e04, not e03, because e03 is at 1.6 against the 1.5 cut line.
  - id: e05
    title: Repository and environment setup (wave 5)
    wsjf: 2.5               # (5 + 3 + 5) / 5; estimate, rescore later
    bcps: 11                # sliced 2026-11-11: 4 stories, 8 to 11 BCPs
    risk: P2
    depends_on: [e04]
    capsule_dir: epics/archive/e05-repo-and-environment
    note: >-
      Added by change-request 2026-11-08 after the owner asked for it.
      Branch protection, PR template, environment setup, porting the
      spec validator into tools/. Sliced with slice-tasks when e04 is
      done; the stack choice (open for e04s02) shapes it. Minimal CI is e01s04.
      Input from the e01 checkpoint: agents in CI through GitHub
      Actions (R0 candidate 3).
      Done and archived by release-branch for e05s04, 2026-11-11.
  # Added by change-request 2026-11-11 from the e04 checkpoint
  # decisions (docs/research/SYNTHESIS.md, "Candidate build epics").
  # All six belong to release 0.2.0 (next_release below). Order is
  # execution order: B1, then B3 and B2, then B5 and B6, then B4. WSJF
  # scores are planner estimates; BCPs are set when slice-tasks sizes
  # each epic.
  - id: e06
    title: Engine core and done gate (B1)
    wsjf: 3.5               # (10 + 8 + 10) / 8; estimate
    bcps: 17                # sliced 2026-11-11: 5 stories, 3 to 5 BCPs
    risk: P1
    depends_on: [e05]
    capsule_dir: epics/archive/e06-engine-core-done-gate
    release: "0.2.0"
    note: >-
      Candidate B1. Holds the evidence gate every later epic needs.
  - id: e07
    title: Host adapters (B3)
    wsjf: 4.2               # (8 + 5 + 8) / 5; estimate
    bcps: 20                # sliced 2026-11-12: 4 stories; e07s02 3 to 5
    risk: P2
    depends_on: [e06]
    capsule_dir: epics/archive/e07-host-adapters
    release: "0.2.0"
    note: >-
      Candidate B3. Claude Code first; pi only if the wrapper stays
      small. Raw WSJF is above e06, but it needs the engine.
      Done and archived 2026-11-13; the pi wrapper was left out and is
      not planned.
  - id: e08
    title: State and handoff (B2)
    wsjf: 3.8               # (8 + 3 + 8) / 5; estimate
    bcps: 19                # sliced 2026-11-13: 4 stories, 4 to 5 BCPs
    risk: P2
    depends_on: [e06]
    capsule_dir: epics/e08-state-and-handoff
    release: "0.2.0"
    note: Candidate B2. Runs in the same step as e07; no dependency.
  - id: e09
    title: Budget and ceilings (B5)
    wsjf: 2.6               # (5 + 3 + 5) / 5; estimate
    risk: P2
    depends_on: [e06]
    capsule_dir: epics/e09-budget-and-ceilings
    release: "0.2.0"
    note: >-
      Candidate B5. The spend cap for experiments stays deferred.
  - id: e10
    title: Security baseline (B6)
    wsjf: 3.2               # (5 + 3 + 8) / 5; estimate
    risk: P2
    depends_on: [e07]
    capsule_dir: epics/e10-security-baseline
    release: "0.2.0"
    note: Candidate B6.
  - id: e11
    title: Skills and entry command (B4)
    wsjf: 3.6               # (8 + 5 + 5) / 5; estimate
    risk: P2
    depends_on: [e07]
    capsule_dir: epics/e11-skills-and-entry-command
    release: "0.2.0"
    note: >-
      Candidate B4. Last, because e07 installs the skills on each host.

# Release after 0.1.0. The 0.1.0 release above ends with e05; the
# validator reads only the "release" block, so this one is a label.
next_release:
  version: "0.2.0"
  codename: First build
  status: planning
  semantic_release: false
  epics: [e06, e07, e08, e09, e10, e11]

# Recorded, not scheduled (owner decision, 2026-11-11). Definitions are
# in docs/research/SYNTHESIS.md. No capsule exists for these.
unscheduled:
  - id: B7
    title: Measurement harness and first experiment
    depends_on: [e06, e07]
    blocked_on: >-
      the owner sets a spend cap and confirms the experiment task
      source (any outside path must be named again)
  - id: B8
    title: Parallel work, after the first release
    depends_on: [e06, e08]
  - id: B9
    title: Auto mode, after the first release (owner request)
    depends_on: [e06, e07, e08, e09, e10]
    note: its candidate hypothesis needs B7 to measure
