---
# Release index. Story status lives in execution-status.yaml, not here.
# Order = execution order. Dependencies override raw WSJF: e04 scores
# higher than e02 and e03 but needs both, so it runs last.
release:
  version: "0.1.0"          # label only; no code ships in this release
  codename: Research program
  status: planning
  semantic_release: false
  bump_hint: patch

# WSJF = (business value + time criticality + risk reduction) / size,
# each 1-10. Size follows BCPs. These scores are estimates by the
# planner, not measurements; revise them with change-request.
epics:
  - id: e01
    title: Foundations (wave 1)
    wsjf: 6.25              # (8 + 8 + 9) / 4; not rescored for s04
    bcps: 14
    risk: P1
    depends_on: []
    capsule_dir: epics/archive/e01-foundations
    note: >-
      Builds the brief checker and can reshape later epics, so it runs
      first and ends in a re-plan checkpoint. Done and archived by
      change-request 2026-11-08.
  - id: e02
    title: Tools and hosts (wave 2)
    wsjf: 3.6               # (7 + 5 + 6) / 5
    bcps: 14
    risk: P2
    depends_on: [e01]
    capsule_dir: epics/archive/e02-tools-and-hosts
    note: >-
      Done and archived by release-branch for e02s04, 2026-11-08.
  - id: e03
    title: Design topics (wave 3)
    wsjf: 1.6               # (6 + 4 + 6) / 10
    bcps: 41
    risk: P2
    depends_on: [e02]
    capsule_dir: epics/e03-design-topics
    note: >-
      Rescored by change-request 2026-11-08 after the e01 re-plan
      checkpoint: new R15 story, and added topics or tasks in R7, R9,
      R11 and R12. Close to the 1.5 cut threshold; the R15 story is the
      first to cut if the research program needs to shrink. A second
      change request on the same day moved two R5 and R3 candidates into
      e03s07 (R13) with no BCP change: locate the "Code as Agent
      Harness" survey and read Kiro's steering and hooks pages.
  - id: e04
    title: Evaluation and synthesis (wave 4)
    wsjf: 3.8               # (7 + 4 + 8) / 5
    bcps: 16
    risk: P2
    depends_on: [e03]
    capsule_dir: epics/e04-evaluation-synthesis
    note: >-
      Highest raw WSJF after e01, but it needs a candidate workflow and
      every earlier brief, so it stays last. Rescored by change-request
      2026-11-08: new R16 evidence-refresh story that runs before the
      synthesis (skill listing cost, .agents/skills runtime test, BMAD v7
      re-check). Time criticality 3 to 4 for the dated BMAD v7 re-check,
      job size 4 to 5. Story-level WSJF for R16 is (5 + 5 + 5) / 5 = 3.0.
      Put in e04, not e03, because e03 is at 1.6 against the 1.5 cut line.
  - id: e05
    title: Repository and environment setup (wave 5)
    wsjf: 2.5               # (5 + 3 + 5) / 5; estimate, rescore later
    bcps: 8
    risk: P2
    depends_on: [e04]
    capsule_dir: epics/e05-repo-and-environment
    note: >-
      Added by change-request 2026-11-08 after the owner asked for it.
      Branch protection, PR template, environment setup, porting the
      spec validator into tools/. Sliced with slice-tasks when e04 is
      done; the stack choice (open for e04s02) shapes it. Minimal CI is e01s04.
      Input from the e01 checkpoint: agents in CI through GitHub
      Actions (R0 candidate 3).
